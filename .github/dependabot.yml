version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      oxc:
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      cloudflare:
        patterns:
          - wrangler

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
